<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <radialGradient id="iconGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141E2B"/>
      <stop offset="100%" stop-color="#070A0E"/>
    </radialGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3AE4D2"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2AD9C6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Icon Section (Left) -->
  <g transform="translate(10, 10)">
    <rect width="200" height="200" rx="44" fill="url(#iconGlow)"/>
    <rect width="200" height="200" rx="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- Converging Highway Road Perspective -->
    <path d="M 68 174 L 90 98 L 110 98 L 132 174 Z" fill="url(#roadGrad)"/>
    <line x1="100" y1="98" x2="100" y2="174" stroke="#2AD9C6" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Radiating Signal Rings -->
    <circle cx="100" cy="74" r="54" fill="none" stroke="#2AD9C6" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.35"/>
    <circle cx="100" cy="74" r="40" fill="none" stroke="#2AD9C6" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Lens Ring -->
    <circle cx="100" cy="74" r="28" fill="#0C131D" stroke="url(#tealGrad)" stroke-width="5"/>

    <!-- Hexagonal Aperture Iris -->
    <polygon points="100,52 119,63 119,85 100,96 81,85 81,63" fill="#162334" stroke="#2AD9C6" stroke-width="3"/>
    
    <!-- Center Node -->
    <circle cx="100" cy="74" r="9" fill="url(#tealGrad)"/>
    <circle cx="97" cy="71" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography Section (Right) -->
  <g transform="translate(245, 10)">
    <!-- Wordmark -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#FFFFFF">
      Road<tspan fill="#2AD9C6">Pulse</tspan>
    </text>

    <!-- Category Label -->
    <rect x="3" y="118" width="160" height="24" rx="12" fill="rgba(42, 217, 198, 0.12)" stroke="rgba(42, 217, 198, 0.3)" stroke-width="1"/>
    <text x="14" y="134" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2AD9C6" letter-spacing="1.5">
      SMART ROAD VISION
    </text>

    <!-- Tagline -->
    <text x="3" y="178" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#9CA3AF" letter-spacing="-0.2">
      Every road has a pulse. We read it in real time.
    </text>
  </g>
</svg>

